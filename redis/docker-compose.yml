services:
  redis:
    image: redis:8.2.10
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - main_redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  main_redis_data:
  redisinsight-data: